# Codex runtime configuration

model = "gpt-4o-mini"
model_provider = "openai"
approval_policy = "never"
sandbox_mode = "danger-full-access"

# Execution environment - allow network and specific commands
[sandbox_workspace_write]
network_access = true

[projects."/ws"]
trust_level = "trusted"

[projects."/ws/out"]
trust_level = "trusted"
