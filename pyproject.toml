[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[project]
name = "resbot"
version = "0.1.0"
description = "Resolve bot: webhook server and runner"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.114.1",
    "uvicorn[standard]==0.30.6",
    "requests==2.32.3",
    "PyJWT[crypto]==2.9.0",
    "docker==7.1.0",
]

[project.scripts]
resbot-runner = "resbot.runner.main:main"
resbot-server = "resbot.server.app.main:run"


