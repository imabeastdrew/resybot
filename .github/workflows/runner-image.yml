name: Build and publish runner image

on:
  workflow_dispatch:
    inputs:
      codex_tag:
        description: Codex release tag (e.g., rust-v0.50.0)
        required: false
        default: rust-v0.50.0
      image_name:
        description: Full image name to push
        required: false
        default: ghcr.io/imabeastdrew/resbot-runner
  schedule:
    - cron: '0 6 * * *'

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ inputs.image_name || format('ghcr.io/{0}/resbot-runner', github.repository_owner) }}
      CODEX_TAG: ${{ inputs.codex_tag || 'rust-v0.50.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CODEX_TAG=${{ env.CODEX_TAG }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.CODEX_TAG }}

